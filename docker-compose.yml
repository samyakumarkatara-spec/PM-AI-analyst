# Demo "customer warehouse": a Postgres seeded with fake SaaS product data.
services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
