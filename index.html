<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --paper: #f4f5f8; --surface: #ffffff; --ink: #162033; --muted: #627089; --line: #dde1e9;
  --accent: #2b44e0; --accent-ink: #ffffff; --accent-soft: #e8ebff;
  --ask: #fff3d6; --ask-line: #e3b04b; --ask-ink: #5b3f06;
  --err: #b42318; --code: #f0f2f7;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1522; --surface: #172033; --ink: #e8ecf5; --muted: #93a0b8; --line: #28334b;
    --accent: #7d8fff; --accent-ink: #0f1522; --accent-soft: #232d57;
    --ask: #2c2410; --ask-line: #a07a22; --ask-ink: #f1d9a0;
    --err: #ff8a7a; --code: #1d283e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { margin: 0; font: 600 16px var(--sans); letter-spacing: -0.01em; }
header .sub { color: var(--muted); font-size: 13px; margin-left: 10px; font-weight: 400; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

main { flex: 1; overflow-y: auto; }
#feed { max-width: 780px; margin: 0 auto; padding: 28px 20px 40px; display: flex; flex-direction: column; gap: 28px; }

.empty h2 { font: 500 30px/1.15 var(--serif); letter-spacing: -0.01em; margin: 24px 0 8px; max-width: 18em; }
.empty p { color: var(--muted); margin: 0 0 20px; max-width: 34em; }
.suggest { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.suggest button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; text-align: left; }
.suggest button:hover { border-color: var(--accent); }

.user { align-self: flex-end; max-width: 80%; background: var(--accent-soft); border-radius: 12px 12px 2px 12px; padding: 9px 14px; white-space: pre-wrap; }

.turn { display: flex; flex-direction: column; gap: 14px; border-left: 2px solid var(--line); padding-left: 18px; }
.prose { font: 400 17px/1.6 var(--serif); max-width: 40em; }
.prose p { margin: 0 0 .75em; } .prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { padding-left: 1.2em; margin: 0 0 .75em; } .prose li { margin-bottom: .3em; }
.prose strong { font-weight: 600; }
.prose code { font: 13.5px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; }

.status { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }

details.query { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.query > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
details.query > summary::-webkit-details-marker { display: none; }
details.query > summary::before { content: "\25B8"; color: var(--muted); transition: transform .12s; }
details.query[open] > summary::before { transform: rotate(90deg); }
details.query .meta { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
details.query.failed { border-color: var(--err); }
.qbody { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
pre.sql { margin: 0; background: var(--code); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 var(--mono); white-space: pre; }
.qerr { color: var(--err); font-size: 13.5px; }
.tablewrap { overflow: auto; max-height: 320px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.note { color: var(--muted); font-size: 12.5px; }

figure.chart { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
figure.chart figcaption { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
figure.chart .box { position: relative; height: 280px; }

.remember { font-size: 13px; color: var(--muted); }
.remember b { color: var(--ink); font-weight: 500; }
.error { color: var(--err); font-size: 14px; }

/* The clarification card is the one distinctive moment in the UI */
.ask { background: var(--ask); border: 1px solid var(--ask-line); border-radius: 12px; padding: 18px 20px; color: var(--ask-ink); max-width: 40em; }
.ask .q { font: 500 21px/1.3 var(--serif); margin: 0 0 6px; }
.ask .why { margin: 0 0 14px; font-size: 13.5px; opacity: .85; }
.ask .opts { display: flex; flex-direction: column; gap: 8px; }
.ask .opts button { background: var(--surface); color: var(--ink); border: 1px solid var(--ask-line); border-radius: 8px; padding: 10px 14px; text-align: left; }
.ask .opts button:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ask .hint { margin: 12px 0 0; font-size: 12.5px; opacity: .8; }
.ask.answered { opacity: .65; }
.ask.answered .opts button { cursor: default; }
.ask.answered .opts button.chosen { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

footer { border-top: 1px solid var(--line); background: var(--surface); padding: 14px 20px; }
.composer { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
textarea { flex: 1; resize: none; max-height: 160px; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; }
.send:disabled { opacity: .45; cursor: default; }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: min(560px, 92vw); padding: 20px; }
dialog::backdrop { background: rgba(10, 14, 24, .5); }
dialog h3 { margin: 0 0 4px; font: 500 22px var(--serif); }
dialog .lead { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
.gl { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.gl div { flex: 1; } .gl b { font-weight: 600; } .gl span { color: var(--muted); display: block; font-size: 13.5px; }
.gl button { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div><h1 style="display:inline">PM Analyst<span class="sub">Ask your data in plain English</span></h1></div>
  <div style="display:flex; gap:8px">
    <button class="ghost" id="glossaryBtn">Glossary</button>
    <button class="ghost" id="newBtn">New chat</button>
  </div>
</header>

<main id="main"><div id="feed"></div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask a question about your product data" aria-label="Your question"></textarea>
    <button class="send" id="sendBtn">Ask</button>
  </div>
</footer>

<dialog id="glossary">
  <h3>Glossary</h3>
  <p class="lead">Definitions the analyst learned from your answers. It uses these instead of asking again.</p>
  <div id="glList"></div>
  <div style="text-align:right; margin-top:14px"><button class="ghost" id="glClose">Close</button></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const feed = $('#feed'), input = $('#input'), sendBtn = $('#sendBtn'), main = $('#main');
let convId = null, busy = false, activeAsk = null;

const SUGGESTIONS = [
  'How many users do we have on each plan?',
  'What is our total MRR?',
  "How's retention looking?",
  'Who are our top customers?',
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function scroll() { main.scrollTop = main.scrollHeight; }
function fmt(v) {
  if (v === null || v === undefined) return '\u2014';
  if (typeof v === 'number') return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return String(v);
}

function showEmpty() {
  feed.innerHTML = '';
  const box = el('div', 'empty');
  box.append(el('h2', null, 'What do you want to know about your product?'));
  box.append(el('p', null, 'The analyst writes the SQL, runs it read-only against your warehouse, and explains what it finds. When your question could mean more than one thing, it asks first.'));
  const list = el('div', 'suggest');
  SUGGESTIONS.forEach((s) => { const b = el('button', null, s); b.onclick = () => send(s); list.append(b); });
  box.append(list);
  feed.append(box);
}

function newTurn() {
  const root = el('div', 'turn');
  feed.append(root);
  return { root, textEl: null, raw: '', status: null, query: null };
}

function setStatus(turn, label) {
  if (!turn.status) { turn.status = el('div', 'status'); turn.root.append(turn.status); }
  turn.status.textContent = label;
  turn.root.append(turn.status); // keep it last
}

function renderTable(cols, rows) {
  const wrap = el('div', 'tablewrap');
  const t = el('table');
  const numeric = cols.map((_, i) => rows.length && rows.every((r) => r[i] === null || typeof r[i] === 'number'));
  const head = el('tr');
  cols.forEach((c, i) => head.append(el('th', numeric[i] ? 'num' : null, c)));
  t.append(head);
  rows.slice(0, 50).forEach((r) => {
    const tr = el('tr');
    r.forEach((v, i) => tr.append(el('td', numeric[i] ? 'num' : null, fmt(v))));
    t.append(tr);
  });
  wrap.append(t);
  return wrap;
}

const PALETTE = ['#2b44e0', '#d9822b', '#1f9d74', '#c2417a', '#6b7280', '#8a5cf6'];
function renderChart(ev) {
  const fig = el('figure', 'chart');
  fig.append(el('figcaption', null, ev.title));
  const box = el('div', 'box'), canvas = el('canvas');
  box.append(canvas); fig.append(box);
  const css = getComputedStyle(document.documentElement);
  const grid = css.getPropertyValue('--line').trim(), text = css.getPropertyValue('--muted').trim();
  const datasets = ev.series.map((s, i) => ({
    label: s.name,
    data: ev.chart_type === 'scatter' ? s.points : s.values,
    backgroundColor: PALETTE[i % PALETTE.length], borderColor: PALETTE[i % PALETTE.length],
    pointRadius: ev.chart_type === 'line' ? 0 : 3, tension: .25, borderWidth: 2,
  }));
  requestAnimationFrame(() => new Chart(canvas, {
    type: ev.chart_type,
    data: { labels: ev.labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: datasets.length > 1, labels: { color: text } } },
      scales: {
        x: { ticks: { color: text, maxTicksLimit: 10 }, grid: { color: grid }, title: { display: true, text: ev.x_label, color: text } },
        y: { ticks: { color: text }, grid: { color: grid } },
      },
    },
  }));
  return fig;
}

function handle(turn, ev) {
  if (ev.type !== 'text') turn.textEl = null;
  switch (ev.type) {
    case 'conversation': convId = ev.id; break;
    case 'text':
      if (!turn.textEl) { turn.textEl = el('div', 'prose'); turn.raw = ''; turn.root.insertBefore(turn.textEl, turn.status); }
      turn.raw += ev.delta;
      turn.textEl.innerHTML = DOMPurify.sanitize(marked.parse(turn.raw));
      break;
    case 'tool': setStatus(turn, ev.label); break;
    case 'sql': {
      const d = el('details', 'query' + (ev.error ? ' failed' : ''));
      const sum = el('summary'); sum.append(el('span', null, ev.purpose || 'Query'));
      d.append(sum);
      const body = el('div', 'qbody');
      body.append(el('pre', 'sql', ev.sql));
      if (ev.error) body.append(el('div', 'qerr', ev.error));
      d.append(body);
      turn.query = { d, sum, body };
      turn.root.insertBefore(d, turn.status);
      break;
    }
    case 'table':
      if (turn.query) {
        turn.query.sum.append(el('span', 'meta', `${ev.row_count.toLocaleString()} rows${ev.truncated ? '+' : ''} \u00b7 ${ev.elapsed_ms} ms`));
        turn.query.body.append(renderTable(ev.columns, ev.rows));
        if (ev.row_count > 50) turn.query.body.append(el('div', 'note', `Showing the first 50 of ${ev.row_count.toLocaleString()} rows.`));
        if (ev.truncated) turn.query.body.append(el('div', 'note', 'Result hit the row cap and is partial.'));
      }
      break;
    case 'chart': turn.root.insertBefore(renderChart(ev), turn.status); break;
    case 'glossary': {
      const r = el('div', 'remember'); r.append('Remembered: ');
      const b = el('b', null, ev.term); r.append(b, ` \u2014 ${ev.definition}`);
      turn.root.insertBefore(r, turn.status);
      break;
    }
    case 'question': {
      const card = el('div', 'ask');
      card.append(el('p', 'q', ev.question));
      if (ev.why) card.append(el('p', 'why', ev.why));
      const opts = el('div', 'opts');
      ev.options.forEach((o) => {
        const b = el('button', null, o);
        b.onclick = () => { b.classList.add('chosen'); send(o); };
        opts.append(b);
      });
      card.append(opts, el('p', 'hint', 'Or type your own answer below.'));
      activeAsk = card;
      turn.root.insertBefore(card, turn.status);
      break;
    }
    case 'error': {
      const e = el('div', 'error', ev.message); turn.root.insertBefore(e, turn.status); break;
    }
    case 'done':
      if (turn.status) { turn.status.remove(); turn.status = null; }
      break;
  }
  scroll();
}

async function send(text) {
  text = (text || '').trim();
  if (busy || !text) return;
  if (feed.querySelector('.empty')) feed.innerHTML = '';
  if (activeAsk) {
    activeAsk.classList.add('answered');
    activeAsk.querySelectorAll('button').forEach((b) => (b.disabled = true));
    activeAsk = null;
  }
  feed.append(el('div', 'user', text));
  input.value = ''; autosize();
  busy = true; sendBtn.disabled = true;
  const turn = newTurn();
  setStatus(turn, 'Thinking');
  scroll();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversation_id: convId }),
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (chunk.startsWith('data: ')) handle(turn, JSON.parse(chunk.slice(6)));
      }
    }
  } catch (e) {
    handle(turn, { type: 'error', message: `Could not reach the analyst: ${e.message}` });
    handle(turn, { type: 'done' });
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); } });
sendBtn.onclick = () => send(input.value);
$('#newBtn').onclick = () => { if (busy) return; convId = null; activeAsk = null; showEmpty(); input.focus(); };

const dlg = $('#glossary');
async function loadGlossary() {
  const data = await (await fetch('/api/glossary')).json();
  const list = $('#glList'); list.innerHTML = '';
  const terms = Object.entries(data);
  if (!terms.length) { list.append(el('p', 'note', 'Nothing yet. When the analyst asks what a term means, your answer is saved here.')); return; }
  terms.forEach(([term, def]) => {
    const row = el('div', 'gl'), body = el('div');
    body.append(el('b', null, term), el('span', null, def));
    const del = el('button', null, 'Forget');
    del.onclick = async () => { await fetch('/api/glossary/' + encodeURIComponent(term), { method: 'DELETE' }); loadGlossary(); };
    row.append(body, del); list.append(row);
  });
}
$('#glossaryBtn').onclick = () => { loadGlossary(); dlg.showModal(); };
$('#glClose').onclick = () => dlg.close();

showEmpty();
input.focus();
</script>
</body>
</html>
